version: 2

# MCP catalog expressed as dbt model-schema YAML. Each data source is described as an
# ordinary dbt model with `columns`; everything MCP-specific lives under `meta.mcp`
# (model-level and column-level). The loader (src/catalog.js) transforms this into the
# internal registry. Every model here is a thin view over a finished bi-dbt prod table
# declared in sources.yml. Exactly one model per ROLE; several models may be events
# SOURCES (each with its own known_events + event-scoped payload + primary_entity).
# Events sources are INDEPENDENT AND EQUAL — none is a default: the source is always a
# separate tool argument (semantic_index({ source, event }), build_native_model({ source }),
# semantic_models[].from) and never part of a name, and each keeps its own space in the
# value index. Within a source, event and property names are used as-is.
# The parsing/attribution already happened upstream — we DO NOT re-parse anything;
# we take the ready, flattened columns as-is and only re-shape (rename role columns).
#
# Descriptions are written for an AI consumer: each one states what the field is,
# which event(s) it appears on, its unit/allowed values, and any gotchas. The
# event taxonomy is documented in Confluence (space PA, "Кастомные аналитические
# события (с девайса игрока)") and covers a portfolio of word/puzzle games
# (Fillwords, Jigsawgram, Relax Puzzles, Sky Words, Sudoku Master, Tile Trip,
# Word Pizza, Word Search Sea, Word Spells).
#
# NAMING: hierarchical names use `_of_` (leaf-first), NEVER `__` — MetricFlow
# reserves `__` as the entity/dimension separator. The upstream payload field
# event_data.additional_info.network is the column `network_of_additional_info_of_event_data`;
# envelope main_data.app_id is `app_id_of_main_data`; the grain key is `player_id_of_internal`.
# (Alias the physical columns to these names in the dbt model.)
#
# IMPORTANT for the AI consumer: the envelope columns (*_of_main_data, *_of_device_info,
# *_of_state) are present on EVERY event. Each *_of_event_data payload property, by
# contrast, only carries a value for the events listed in its `meta.mcp.events` array
# (also repeated as "Events:" in the description) — on any other event_name it is NULL.
# Always filter by event_name to the relevant event(s) before using a payload field;
# do not assume it exists on every row.
#
# Types come from the NATIVE dbt `data_type` (date/timestamp -> time dimension,
# else categorical) — not from meta. On a dimension model every non-entity column
# is a groupable dimension automatically. meta.mcp only carries what dbt has no
# native field for:
#   entity:        { name, type: primary|foreign }  -> entity / join key
#   is_time:       true (+ granularity, default day) -> the event time axis
#   is_event_name: true                             -> the event_name column
#   dimension:     {}                               -> mark an events-fact column groupable
#   array:         { items|fields, encoding }       -> an array column (encoding: native|json) — unnestable
#   values:        [..]                             -> categorical value hints (optional)
#   events:        [..]                             -> event_name(s) a payload field applies to
#
# The grain / join key across the models is `player_id_of_internal` (an INT64
# surrogate id present on the prod events fact, installs and experiments tables).
# The events payload is ALREADY flattened upstream into real typed columns
# (*_of_event_data), referenced directly — there is no raw JSON payload column. The
# facts are detected from their is_event_name + is_time columns.
#
# The warehouse dialect is NOT stored here — it is runtime config, resolved from
# the WAREHOUSE_DIALECT env var or the dbt profile's output `type`.

models:
  - name: fct_analytics_events
    description: >
      Client analytics events fact: one row per tracked in-game event sent from
      the player's device. Every event shares an envelope (main_data context,
      device_info, and a state snapshot of the player) plus a per-event payload,
      all flattened upstream into real typed columns (*_of_event_data). Use
      event_name to pick an event type, device_time for the time axis, and
      player_id_of_internal to join to dim_users / fct_experiment_assignments.
      Envelope columns (*_of_main_data, *_of_device_info, *_of_state) exist on every
      event; each *_of_event_data field only applies to the events in its
      meta.mcp.events array and is NULL elsewhere — always scope by event_name first.
    meta:
      mcp:
        role: events           # the logical name the tools use (the dbt model can be named anything)
        primary_entity: event  # the grain of the fact (no physical key column)
        # The physical partition column — queries MUST constrain it (or device_time)
        # or the warehouse scans the whole fact. Surfaced as a static cost hint.
        partition_column: event_date
        # Business meaning of the key events — which event marks an install, a return
        # visit, a purchase — so retention/conversion metrics anchor on the RIGHT events.
        event_semantics:
          acquisition_event: first_launch        # install / first activity (cohort anchor)
          session_event: new_session             # return-visit marker (DAU, retention)
          session_end_event: end_session         # carries session_duration
          purchase_event: iap_purchase_completed # realized IAP revenue
          ad_impression_event: ad_finished       # realized ad revenue (revenue field)
        known_events:
          # activity
          - first_launch
          - new_session
          - end_session
          # levels / puzzles / games
          - level_started
          - fragment_started
          - fragment_finished
          - level_completed
          - word_selected
          - battle_of_wits_started
          - battle_of_wits_finished
          - puzzle_started
          - puzzle_part_completed
          - puzzle_completed
          # economy
          - currency_income
          - currency_outcome
          # in-game timed events
          - event_start
          - event_prize
          - event_end
          # advertising
          - ad_requested
          - ad_loaded
          - ad_available
          - ad_blocked
          - ad_incident
          - ad_analyzed
          - ad_started
          - ad_finished
          - ad_freezed
          - ad_redirected
          # in-app purchases
          - shop_opened
          - iap_started
          - iap_purchase_failed
          - iap_purchase_completed
          # interface
          - screen_changed
          # mechanics
          - progress_restored
          - piggy_bank_opened
          - tutorial
          - wheel_spin
    columns:
      # ---- role columns ---------------------------------------------------
      - name: player_id_of_internal
        data_type: integer
        description: >
          Stable internal player id (surrogate hash of appsflyer_id + bundle_id +
          platform). The canonical join key from events to dim_users and
          fct_experiment_assignments. Present on every event.
        meta:
          mcp:
            entity: { name: user, type: foreign }
      - name: session_number
        data_type: integer
        description: >
          Per-player session counter that increments on each new_session. Present
          on every event. Use it to order a player's sessions or aggregate per session.
        meta:
          mcp:
            entity: { name: session, type: foreign }
      - name: device_time
        data_type: timestamp
        description: >
          When the event happened on the player's device, normalized to the
          player's time zone. Present on every event. This is the metric time axis.
        meta:
          mcp:
            is_time: true   # granularity defaults to day
      - name: event_name
        data_type: string
        description: >
          The event type. Always one of known_events (e.g. first_launch,
          level_completed, currency_income, ad_finished, iap_purchase_completed).
          Filter on this first to scope a query to a specific event.
        meta:
          mcp:
            is_event_name: true
      - name: event_version
        data_type: string
        description: >
          Schema version of the event. Present on every event. Some payload fields
          only exist from a given version (e.g. currency_income gained
          monetization_type in v1; ad events moved status from ad_started to
          ad_finished in later versions).
        meta:
          mcp:
            dimension: {}   # groupable on every event (filter/segment by schema version)
      - name: event_date
        data_type: timestamp
        description: >
          Day-truncated event date. Present on every event. This is the partition
          column of the source table — always constrain queries on it (or device_time).
        meta:
          mcp:
            dimension: {}   # groupable (daily buckets); device_time remains the metric_time axis

      # ---- envelope: main_data (present on EVERY event) -------------------
      - name: bundle_id
        data_type: string
        description: "Resolved store bundle id of the app the event came from. Present on every event."
        meta:
          mcp:
            dimension: { bundle: true }   # the APP identifier: groupable on every event (segment by app without a users-join) AND drives per-app coverage in semantic_index({ bundle })
      - name: app_id_of_main_data
        data_type: string
        description: >
          Short app code identifying the game (e.g. fillwords, relax_puzzles,
          sky_words, tile_trip, word_pizza, word_search_sea, word_spells). Present on every event.
        meta:
          mcp:
            dimension: {}
      # NOTE: user/install attributes (platform, country, media_source, ab_test_group,
      # is_valid_install, install_*) are NOT columns of this fact — they are per-player
      # attributes on dim_users (role: users). Reach them by joining 'users' and grouping
      # /filtering on user__<name> (e.g. user__country, user__media_source). The fact
      # declares only what is physically materialized per event.
      - name: appsflyer_id_of_main_data
        data_type: string
        description: "AppsFlyer device id (client-stored attribution id). Present on every event."
      - name: appmetrica_id_of_main_data
        data_type: string
        description: "AppMetrica device id. Present on every event."
      - name: active_day_of_main_data
        data_type: integer
        description: >
          Ordinal calendar active-day of the player, counting from 1 on the first
          active day. Present on every event. Useful as a lifetime/retention axis.
      - name: playtime_of_main_data
        data_type: numeric
        description: "Cumulative playtime in seconds (including ad views). Present on every event."
        meta:
          mcp:
            unit: seconds
      - name: build_version_of_main_data
        data_type: string
        description: "Current app version (semantic version string) at event time. Present on every event."
        meta:
          mcp:
            dimension: {}
      - name: build_number_of_main_data
        data_type: string
        description: "Current app build number at event time. Present on every event."
      - name: is_test_of_main_data
        data_type: string
        description: "TRUE when the player is an internal tester; exclude for production analytics."
        meta:
          mcp:
            dimension: {}
      - name: event_id_of_main_data
        data_type: string
        description: "Unique client-generated id of this event (used for dedup upstream). Present on every event."
      - name: time_zone_of_main_data
        data_type: string
        description: "Player time-zone offset (±hh:mm) used to localize device_time. Present on every event."
      - name: device_time_ms_of_main_data
        data_type: integer
        description: "Raw client event time as a local UNIX timestamp in milliseconds. Present on every event."
        meta:
          mcp:
            unit: epoch_milliseconds
      - name: first_launch_ms_of_main_data
        data_type: integer
        description: "Player's first-launch time as a local UNIX timestamp in milliseconds. Present on every event."
        meta:
          mcp:
            unit: epoch_milliseconds

      # ---- envelope: device_info (present on EVERY event) -----------------
      - name: cpu_type_of_device_info
        data_type: string
        description: "Device CPU type. Present on every event."
        meta:
          mcp:
            dimension: {}
      - name: device_model_of_device_info
        data_type: string
        description: "Device model identifier. Present on every event."
        meta:
          mcp:
            dimension: {}
      - name: gpu_of_device_info
        data_type: string
        description: "Device GPU name. Present on every event."
        meta:
          mcp:
            dimension: {}
      - name: graphics_memory_size_of_device_info
        data_type: string
        description: "Graphics memory size in MB (string). Present on every event."
      - name: os_version_of_device_info
        data_type: string
        description: "Operating-system version of the device. Present on every event."
        meta:
          mcp:
            dimension: {}
      - name: resolution_of_device_info
        data_type: string
        description: "Screen resolution string. Present on every event."
        meta:
          mcp:
            dimension: {}
      - name: system_memory_size_of_device_info
        data_type: string
        description: "System RAM size in MB (string). Present on every event."

      # ---- envelope: state — player snapshot at event time (present on EVERY event) ----
      - name: language_of_state
        data_type: string
        description: "In-game language (IETF code) at event time. Present on every event."
        meta:
          mcp:
            dimension: {}
      - name: level_number_of_state
        data_type: string
        description: >
          Last started level of the main progression (chain=common). Present on
          every event. NOTE: this counter starts at 0, unlike most ordinal counters
          which start at 1.
      - name: level_fragment_of_state
        data_type: string
        description: "Current sub-level (fragment) index within a staged level. Present on every event."
      - name: puzzles_completed_of_state
        data_type: string
        description: "Total puzzles the player has completed so far. Present on every event."
      - name: relax_level_of_state
        data_type: string
        description: "Relax-progress level (percent), for relax-style games. Present on every event."
      - name: skill_points_of_state
        data_type: string
        description: "Player's accumulated skill points. Present on every event."
      - name: chosen_skill_level_of_state
        data_type: string
        description: "Player-selected difficulty (Sudoku): not_assigned / novice / intermediate / expert."
        meta:
          mcp:
            dimension: {}
      - name: active_segments_of_state
        data_type: string
        description: "Firebase remote-config segments the player is currently in. Present on every event."
        meta:
          mcp:
            dimension: {}
      - name: coins_balance_of_state
        data_type: string
        description: "Soft-currency (coins) balance at event time. Present on every event."
      - name: lives_balance_of_state
        data_type: string
        description: "Lives balance (deprecated in newer projects)."
      - name: bonus_lives_balance_of_state
        data_type: string
        description: "Bonus-lives balance."
      - name: spins_of_state
        data_type: string
        description: "Wheel/roulette spin balance."
      - name: booster_all_notes_balance_of_state
        data_type: string
        description: "Balance of the 'all notes' booster."
      - name: hint_open_first_letter_balance_of_state
        data_type: string
        description: "Balance of the 'open first letter' hint."
      - name: hint_open_any_letter_balance_of_state
        data_type: string
        description: "Balance of the 'open any letter' hint."
      - name: hint_open_several_letters_balance_of_state
        data_type: string
        description: "Balance of the 'open several letters' hint."
      - name: hint_open_cell_balance_of_state
        data_type: string
        description: "Balance of the 'open cell' hint."
      - name: hint_magnet_balance_of_state
        data_type: string
        description: "Balance of the 'magnet' hint."
      - name: hint_cancel_balance_of_state
        data_type: string
        description: "Balance of the 'cancel' hint."
      - name: hint_shuffle_balance_of_state
        data_type: string
        description: "Balance of the 'shuffle' hint."
      - name: hint_clear_balance_of_state
        data_type: string
        description: "Balance of the 'clear' hint (deprecated)."
      - name: hint_extra_slot_balance_of_state
        data_type: string
        description: "Balance of the 'extra slot' hint."
      - name: auto_openers_balance_of_state
        data_type: string
        description: "Balance of auto-opener hints."

      # ---- event_data: advertising ----------------------------------------
      # (each field below carries a value ONLY for the events in meta.mcp.events)
      - name: ad_type_of_event_data
        data_type: string
        description: "Ad format. Events: all ad_* (ad_requested, ad_loaded, ad_available, ad_blocked, ad_incident, ad_analyzed, ad_started, ad_finished, ad_freezed, ad_redirected)."
        meta:
          mcp:
            values: [rewarded, interstitial, banner]
            events: [ad_requested, ad_loaded, ad_available, ad_blocked, ad_incident, ad_analyzed, ad_started, ad_finished, ad_freezed, ad_redirected]
      - name: placement_of_event_data
        data_type: string
        description: "In-app ad placement / trigger point (e.g. store, level_fail, main_menu). Events: ad_available, ad_started, ad_finished, ad_freezed."
        meta:
          mcp:
            events: [ad_available, ad_started, ad_finished, ad_freezed]
      - name: status_of_event_data
        data_type: string
        description: "Result of the ad action — ad_loaded: success/failure/expired; ad_available: ready/no_advertise/no_internet; ad_finished: success/crash/display_failed. Events: ad_loaded, ad_available, ad_finished (legacy ad_started)."
        meta:
          mcp:
            events: [ad_loaded, ad_available, ad_finished, ad_started]
      - name: revenue_of_event_data
        data_type: numeric
        description: "Ad revenue for the impression; 0 on failure. Events: ad_loaded, ad_started, ad_finished."
        meta:
          mcp:
            unit: usd      # NOT comparable with coins amounts; declare the real unit of YOUR pipeline here
            events: [ad_loaded, ad_started, ad_finished]
      - name: display_duration_of_event_data
        data_type: string
        description: "Seconds the ad was displayed on screen. Events: ad_finished."
        meta:
          mcp:
            unit: seconds  # numeric-in-meaning but typed string -> cast before aggregating
            events: [ad_finished]
      - name: is_clicked_of_event_data
        data_type: string
        description: "Whether the player clicked the ad. Events: ad_finished, ad_redirected."
        meta:
          mcp:
            events: [ad_finished, ad_redirected]
      - name: is_rewarded_of_event_data
        data_type: string
        description: "Whether the impression was a rewarded ad. Events: ad_started, ad_finished."
        meta:
          mcp:
            events: [ad_started, ad_finished]
      - name: is_reward_received_of_event_data
        data_type: string
        description: "Whether the rewarded-ad reward was granted. Events: ad_finished, ad_freezed."
        meta:
          mcp:
            events: [ad_finished, ad_freezed]
      - name: is_user_returned_of_event_data
        data_type: string
        description: "Whether the player returned to the app after the ad. Events: ad_finished."
        meta:
          mcp:
            events: [ad_finished]
      - name: tracking_id_of_event_data
        data_type: string
        description: "Ad request tracking id; correlates an ad_requested with its later ad_loaded/started/finished. Events: ad_requested, ad_loaded, ad_blocked, ad_incident, ad_analyzed, ad_started, ad_finished, ad_redirected."
        meta:
          mcp:
            events: [ad_requested, ad_loaded, ad_blocked, ad_incident, ad_analyzed, ad_started, ad_finished, ad_redirected]
      - name: substitution_reason_of_event_data
        data_type: string
        description: "Why a substitute ad was shown instead of the requested one. Events: ad_started, ad_finished."
        meta:
          mcp:
            values: [higher_cost, no_fill]
            events: [ad_started, ad_finished]
      - name: start_watch_time_of_event_data
        data_type: timestamp
        description: "When the player started watching the ad. Events: ad_finished."
        meta:
          mcp:
            events: [ad_finished]
      - name: creative_id_of_additional_info_of_event_data
        data_type: string
        description: "Ad creative id (mediation metadata). Events: ad_loaded, ad_blocked, ad_incident, ad_analyzed, ad_started, ad_finished, ad_redirected."
        meta:
          mcp:
            events: [ad_loaded, ad_blocked, ad_incident, ad_analyzed, ad_started, ad_finished, ad_redirected]
      - name: ad_unit_of_additional_info_of_event_data
        data_type: string
        description: "Ad unit id requested from the mediation SDK. Events: ad_requested, ad_loaded, ad_blocked, ad_incident, ad_analyzed, ad_started, ad_finished, ad_redirected."
        meta:
          mcp:
            events: [ad_requested, ad_loaded, ad_blocked, ad_incident, ad_analyzed, ad_started, ad_finished, ad_redirected]
      - name: network_of_additional_info_of_event_data
        data_type: string
        description: "Ad network that filled the impression (e.g. admob, unity, applovin, ironsource). Events: ad_loaded, ad_blocked, ad_incident, ad_analyzed, ad_started, ad_finished, ad_redirected."
        meta:
          mcp:
            events: [ad_loaded, ad_blocked, ad_incident, ad_analyzed, ad_started, ad_finished, ad_redirected]
      - name: network_code_of_additional_info_of_event_data
        data_type: string
        description: "Network-specific status/error code. Events: ad_loaded, ad_finished."
        meta:
          mcp:
            events: [ad_loaded, ad_finished]
      - name: network_message_of_additional_info_of_event_data
        data_type: string
        description: "Network-specific status/error message. Events: ad_loaded, ad_finished."
        meta:
          mcp:
            events: [ad_loaded, ad_finished]
      - name: test_name_of_additional_info_of_event_data
        data_type: string
        description: "Applovin split-tool A/B test name (monetization-side experiment, e.g. 2602_sw_gp_rv_aa_test); distinct from product-side A/B assignments tracked on the experiments source (role: experiments). Events: ad_loaded, ad_started, ad_finished, ad_redirected."
        meta:
          mcp:
            events: [ad_loaded, ad_started, ad_finished, ad_redirected]
      - name: waterfall_latency_of_additional_info_of_event_data
        data_type: string
        description: "Mediation waterfall latency in milliseconds. Events: ad_loaded, ad_started, ad_finished, ad_redirected."
        meta:
          mcp:
            unit: milliseconds  # numeric-in-meaning but typed string -> cast before aggregating
            events: [ad_loaded, ad_started, ad_finished, ad_redirected]
      - name: waterfall_name_of_additional_info_of_event_data
        data_type: string
        description: "Name of the mediation waterfall used. Events: ad_loaded, ad_started, ad_finished, ad_redirected."
        meta:
          mcp:
            events: [ad_loaded, ad_started, ad_finished, ad_redirected]
      - name: max_code_of_additional_info_of_event_data
        data_type: string
        description: "Applovin MAX result/error code. Events: ad_loaded, ad_finished."
        meta:
          mcp:
            events: [ad_loaded, ad_finished]
      - name: max_message_of_additional_info_of_event_data
        data_type: string
        description: "Applovin MAX result/error message. Events: ad_loaded, ad_finished."
        meta:
          mcp:
            events: [ad_loaded, ad_finished]
      - name: response_message_of_additional_info_of_event_data
        data_type: string
        description: "Server/mediation response message. Events: ad_loaded, ad_finished."
        meta:
          mcp:
            events: [ad_loaded, ad_finished]
      - name: response_type_of_additional_info_of_event_data
        data_type: string
        description: "Server/mediation response type. Events: ad_loaded, ad_finished."
        meta:
          mcp:
            events: [ad_loaded, ad_finished]
      - name: should_load_new_ad_of_additional_info_of_event_data
        data_type: string
        description: "AppHarbr hint on whether to load a fresh ad after a block. Events: ad_blocked, ad_incident, ad_analyzed."
        meta:
          mcp:
            events: [ad_blocked, ad_incident, ad_analyzed]
      - name: step_of_additional_info_of_event_data
        data_type: string
        description: "AppHarbr pipeline step where the block/analyze occurred: load / ready / show. Events: ad_blocked, ad_incident, ad_analyzed."
        meta:
          mcp:
            events: [ad_blocked, ad_incident, ad_analyzed]
      - name: user_defined_application_of_additional_info_of_event_data
        data_type: string
        description: "AppHarbr user-defined application label. Events: ad_blocked, ad_incident, ad_analyzed."
        meta:
          mcp:
            events: [ad_blocked, ad_incident, ad_analyzed]
      - name: user_defined_domain_of_additional_info_of_event_data
        data_type: string
        description: "AppHarbr user-defined domain label. Events: ad_blocked, ad_incident, ad_analyzed."
        meta:
          mcp:
            events: [ad_blocked, ad_incident, ad_analyzed]
      - name: block_reasons_of_additional_info_of_event_data
        data_type: array
        description: "AppHarbr reasons the ad was blocked (string array). Events: ad_blocked, ad_incident, ad_analyzed."
        meta:
          mcp:
            events: [ad_blocked, ad_incident, ad_analyzed]
            array: { items: string }
      - name: report_reasons_of_additional_info_of_event_data
        data_type: array
        description: "AppHarbr reasons the ad was reported (string array). Events: ad_blocked, ad_incident, ad_analyzed."
        meta:
          mcp:
            events: [ad_blocked, ad_incident, ad_analyzed]
            array: { items: string }
      - name: analyze_results_of_additional_info_of_event_data
        data_type: array
        description: "AppHarbr ad-analysis results (string array). Events: ad_analyzed (schema shared with ad_blocked, ad_incident)."
        meta:
          mcp:
            events: [ad_analyzed, ad_blocked, ad_incident]
            array: { items: string }
      - name: type_of_crash_info_of_event_data
        data_type: string
        description: "Crash type captured when an ad caused a crash. Events: ad_finished (status=crash)."
        meta:
          mcp:
            events: [ad_finished]
      - name: date_of_crash_info_of_event_data
        data_type: string
