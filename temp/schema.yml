        data_type: integer
        description: "Seconds since the previous word (right or wrong) was collected; for the first word, seconds since level start."
        meta:
          mcp:
            unit: seconds
            property: true
      - name: words_selected_of_event_data
        data_type: json
        description: >
          Per-word collection log: array of {word_number, word_name,
          time_from_previous, mistakes_from_previous, word_dictionary}. Access via
