# Run the MCP server from docker compose. Everything is configured via env vars
# (see .env.example — copy it to .env) and volumes; nothing is hardcoded.
#
#   cp .env.example .env      # then edit
#   docker compose up --build
#
# Point DBT_PROJECT_DIR at YOUR dbt project (it must contain profiles.yml + the
# source models). This setup runs on DuckDB (a database file on a volume); for BigQuery use
# docker-compose.bigquery.yml. CATALOG_PATH/RECIPES_PATH describe those models to the AI.

services:
  mcp:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      # Which warehouse dialect the engine generates for (duckdb | bigquery). Read from the dbt
      # profile when unset; the BigQuery setup is docker-compose.bigquery.yml.
      WAREHOUSE_DIALECT: "${WAREHOUSE_DIALECT:-duckdb}"
      # The dbt project the runner builds/queries against (mounted below). The
      # CATALOG is discovered from THIS project's model YAMLs (meta.mcp.role) — no
      # separate catalog file. (To use a standalone catalog instead, mount it and
      # set CATALOG_PATH, e.g. CATALOG_PATH=/config/catalog.yml.)
      DBT_BASE_PROJECT: "/dbt_project"
      DBT_PROFILES_DIR: "/dbt_project"
      # The dbt environment (a venv under /opt/dbt-envs): `default` is dbt v2, `dbt1` is dbt 1.x. On
      # v2 the python stage is not offered on DuckDB (v2 runs no Python models there) — dbt1 runs it.
      DBT_ENV: "${DBT_ENV:-default}"
      # Optional ready-made recipes (mounted via CONFIG_DIR below).
      RECIPES_PATH: "/config/recipes.json"
      # Persisted per-context workspace (named volume below).
      MCP_WORKSPACE: "/workspace"
      # How long a best-effort warehouse read (column set, freshness) may hold a call (max 30).
      # Queries and builds never hold one: they are tasks, read back with query_semantic_model / query_pipeline_model ({ task_id }).
      QUERY_TIMEOUT_SECONDS: "${QUERY_TIMEOUT_SECONDS:-20}"
      CONTEXT_TTL_MS: "${CONTEXT_TTL_MS:-0}"
      # PERSISTENCE — value index / job history / memory survive a restart (SQLite on the
      # mcp_workspace volume; reset OFF by default). Needs Node >= 22.5 (image is node:22-slim).
      MCP_DB: "${MCP_DB:-/workspace/mcp.sqlite}"
      MCP_MEMORY_DB: "${MCP_MEMORY_DB:-/workspace/memory.sqlite}"
      MCP_DB_RESET: "${MCP_DB_RESET:-false}"
      # The DuckDB database file — referenced by your profiles.yml as path: "{{ env_var('DUCKDB_PATH') }}".
      # It lives on the warehouse volume; one process at a time holds it, and the server queues its
      # dbt/MetricFlow processes on it accordingly.
      DUCKDB_PATH: "${DUCKDB_PATH:-/warehouse/analytics.duckdb}"
    volumes:
      - "${DBT_PROJECT_DIR:-./dbt_project}:/dbt_project"
      - "${CONFIG_DIR:-./config}:/config:ro"
      - mcp_workspace:/workspace
      - warehouse:/warehouse
    restart: unless-stopped

volumes:
  mcp_workspace:
  warehouse:
