        meta:
          mcp:
            property: true
      - name: daily_level_score_of_event_data
        data_type: numeric
        description: >
          Score earned on a daily level, in whatever reward unit that game's daily chain uses.
        meta:
          mcp:
            property: true
      - name: score_of_event_data
        data_type: numeric
        description: "Score achieved in the match — the sum of letters across found words."
        meta:
          mcp:
            property: true
      - name: quest_progress_of_event_data
        data_type: string
        description: "Progress added to the active quest by completing the level; not sent when no quest is active."
        meta:
          mcp:
            property: true
      - name: active_event_of_event_data
        data_type: string
        description: "Active in-game timed event(s) when the unit was played; multiple are comma-separated alphabetically; omitted when none."
        meta:
          mcp:
            property: true
      - name: event_objects_of_event_data
        data_type: string
        description: "Timed-event objects: count on the board at start (level_started/fragment_started), count collected at finish (fragment_finished/level_completed)."
        meta:
          mcp:
            property: true
      - name: found_after_any_hint_of_event_data
        data_type: boolean
        description: "Whether the word/level was solved after using any hint."
        meta:
          mcp:
            property: true
      - name: fragment_number_of_event_data
        data_type: integer
        description: "Sub-level (fragment) index within a staged level (Fillwords staged daily levels, Tile Trip fragments)."
        meta:
          mcp:
            property: true
      - name: fragments_count_of_event_data
        data_type: integer
        description: "Total fragments in the staged level (deprecated since Tile Trip v1.4.13)."
        meta:
          mcp:
            property: true
      - name: tiles_count_of_event_data
        data_type: integer
        description: "Total tiles on the fragment's board (Tile Trip)."
        meta:
          mcp:
            property: true
      - name: tiles_left_of_event_data
        data_type: integer
