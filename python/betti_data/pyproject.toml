[project]
name = "betti-data"
version = "0.1.0"
description = "The sole data-access interface for the Betti Python sandbox: read exported Parquet result sets lazily/out-of-core (no raw paths, no credentials)."
requires-python = ">=3.10"
# The safe manifest core needs nothing. The engines are optional extras so a sandbox installs only
# what it uses; the host image is expected to preinstall [engines].
dependencies = []

# Polars is the single engine (lazy scan + streaming collect + its own SQL). pyarrow backs the
# Arrow-batch streaming path. (No DuckDB: Polars covers scan/SQL/out-of-core for exported result
# sets; DuckDB would only earn a slot for larger-than-RAM join/sort spill, not our case.)
[project.optional-dependencies]
engines = ["polars>=1.0", "pyarrow>=15.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["betti_data"]
