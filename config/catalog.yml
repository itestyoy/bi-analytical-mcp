  # ── DECLARED JOIN KEYS (meta.mcp.entities) ────────────────────────────────────────────
  # A relationship between two models is declared ONCE, in the schema, and both paths use it:
  # a metric query groups by <relationship>__<attribute>, a pipeline joins with `via: <name>`.
  # Neither ever restates a column.
  #
  #   meta.mcp.entities:
  #     <relationship name>:
  #       type: primary | unique | foreign | natural
  #       key:  [<column>, ...]        # ONE column, or SEVERAL for a composite key
  #
  # The two sides may name their columns differently; only the relationship name and the number
  # of key parts have to agree (both checked at catalog load).
  #
  # `primary`/`unique` make the model the join TARGET — exactly one model may own a relationship,
  # and it must be unique per row there. `foreign` points at whichever model owns it. A
  # relationship NOBODY owns is still a perfectly good PIPELINE join (a many-to-many match); it
  # simply has no governed path, because MetricFlow can only join onto a unique key.
  #
  # ── JOINING A SLOWLY-CHANGING MODEL (the install record) ──────────────────────────────
  # dim_users below carries a VALIDITY WINDOW (install_time_valid_from / _until), so it holds
  # several versions per player and every join to it must be POINT-IN-TIME: the player key AND a
  # time inside the window. Joining on the key alone matches every historical version and
  # inflates every count.
  #   · governed path — MetricFlow applies the window itself; just group by user__<attribute>;
  #   · pipeline — state it in the join stage, explicitly:
  #       { stage: "join", with: "users", via: "user",
  #         between: { value: "<this source's time column>",
  #                    from: "install_time_valid_from", to: "install_time_valid_until" } }
  # MetricFlow allows a model with a validity window exactly ONE join key, as its natural key —
  # a second `primary`/`unique` key there is rejected at catalog load. Such a key can still be
  # declared `foreign` and joined in a pipeline.
  #
  # ── VARIANTS: one relationship carried by SEVERAL columns ─────────────────────────────
  # A crash source records the last ad-funnel id it saw PER AD FORMAT, one column each, only the
  # format in play populated. They are variants of one relationship, and the caller picks:
  #
  #   entities:
  #     ad_funnel:
  #       type: foreign
  #       variants:
  #         rewarded:     { key: [rewarded_tracking_id, player_id_of_internal] }
  #         interstitial: { key: [interstitial_tracking_id, player_id_of_internal] }
  #         banner:       { key: [banner_tracking_id, player_id_of_internal] }
  #
  # Each becomes its own relationship — ad_funnel_rewarded / _interstitial / _banner — and the
  # side that has ONE such column declares it plainly once; it answers every variant:
  #
  #   # on the analytics events source
  #   entities:
  #     ad_funnel: { type: foreign, key: [tracking_id, player_id_of_internal] }
  #
  # Joining them reconstructs the ad funnel that was running when the app died. Several events
  # share one funnel id, so neither side is unique on it: this one is pipeline-only, by nature.
  # ── ACQUISITION SPEND (TEMPLATE, not active) ──────────────────────────────────────────
  # A NON-events source: no event_name, so it is not an events fact — but it has its own time
  # axis and its own AMOUNTS, and both are declared HERE, in the schema. The schema says only
  # WHICH fields may be aggregated; WHICH FUNCTION to apply is decided per question by the
  # caller, from
  #   sum | average | min | max | count | count_distinct | sum_boolean | median | percentile
  # (a bad one fails at catalog load, naming the allowed set).
  #
  #   meta.mcp.measure  on a COLUMN   -> MARKS the column an AMOUNT: aggregatable with any of
  #                                     the functions above, chosen by the caller per question.
  #                                     An amount is not an attribute, so the column is neither
  #                                     groupable nor value-indexed. `measure: true`, or an
  #                                     object with unit / label / description to say what it
  #                                     means. Add `agg` (+ `name`) ONLY to ALSO publish a
  #                                     governed measure whose function is fixed for everyone —
  #                                     the free choice over the raw column remains either way.
  #   meta.mcp.measures on the MODEL  -> the same, for an aggregatable EXPRESSION: any SQL over
  #                                     the model's columns, again with no function attached.
  #   meta.mcp.dimension: false       -> a real column that is NOT an attribute (a batch id).
  #   meta.mcp.index: false           -> groupable, but not profiled by the value index (an id).
  #   meta.mcp.is_time                -> the source's time axis, so metric_time and time_range
  #                                     work here exactly as on an events source.
  #
  # HOW IT JOINS (both keys declared in the schema, never restated at the call site):
  #   · to an events source        — by the PLAYER key alone (via: 'user'). One player has many
  #     events and several spend days, so this pairing is many-to-many BY DESIGN: use it to carry
  #     a channel attribute onto events, NEVER to sum money over (the total inflates).
  #   · to the install record      — by the PLAYER key AND the validity window, point-in-time:
  #     the governed path applies the window itself; a pipeline states it in the join stage's
  #     `between` ({ value: spend_date, from: install_time_valid_from, to: install_time_valid_until }).
  #
  # - name: fct_player_acquisition           # TODO: the real dbt model / view name
  #   description: >
  #     Player-level acquisition spend: one row per (player, day) with the cost and impressions
  #     attributed to that player. Amounts are MEASURES; the channel columns are attributes.
  #   meta:
  #     mcp:
  #       role: acquisition
  #       primary_entity: acquisition        # MUST differ from every other model's
  #       partition_column: spend_date       # TODO: the real partition column (cost hint)
  #       # A model-level entry is an aggregatable EXPRESSION over the model's columns. Like a
  #       # marked column it fixes NO aggregation — the caller picks one per question.
  #       measures:
  #         cost_per_click: { expr: "cost / nullif(clicks, 0)", unit: usd }
  #   columns:
  #     - name: acquisition_id               # TODO: a surrogate key for the (player, day) grain
  #       data_type: string
  #       meta: { mcp: { entity: { name: acquisition, type: primary } } }
  #     - name: player_id_of_internal
  #       data_type: integer
  #       meta: { mcp: { entity: { name: user, type: foreign } } }
  #     - name: spend_date
  #       data_type: timestamp
  #       description: "The day the spend was recorded — this source's time axis."
  #       meta: { mcp: { is_time: true } }
  #     - name: cost
  #       data_type: numeric
  #       description: "Acquisition cost attributed to the player that day."
  #       meta: { mcp: { measure: { unit: usd, label: "UA cost" } } }
  #     - name: impressions
  #       data_type: integer
  #       meta: { mcp: { measure: { agg: sum } } }
  #     - name: media_source                 # a plain attribute: groupable, value-indexed
  #       data_type: string
  #     - name: campaign_id
  #       data_type: string
  #       meta: { mcp: { index: false } }    # groupable, but an id has no value set worth profiling
  #     - name: ingest_batch_id
  #       data_type: string
  #       meta: { mcp: { dimension: false } } # a real column, not an attribute
