<body>
  <!-- Shown from the moment the host opens the view until the tool's result arrives: the call can
       take a while on a big window, and an empty frame reads as broken. -->
  <div id="loading" class="loading" role="status" aria-live="polite">
    <span id="loading-icon" class="loading-icon"></span>
    <span class="loading-text">Computing…</span>
  </div>

  <!-- One quiet line for a result that has no card (a failure, a build still running, SQL): the host
       keeps a minimum frame for the view, and an empty one reads as broken. -->
  <div id="status" class="status-line" role="status" hidden></div>

  <main class="main" hidden>
    <header class="page-header">
      <div class="page-header-text">
        <h1 id="title" class="page-title">Query Result</h1>
        <div id="subtitle" class="page-description"></div>
      </div>
      <button id="fullscreen-btn" class="btn btn-outline btn-icon" type="button" title="Enter fullscreen" aria-label="Enter fullscreen" hidden></button>
    </header>

    <div id="notice" class="alert" role="status" hidden></div>

    <section id="chart-section" class="card" hidden>
      <div class="card-header">
        <h2 id="chart-title" class="card-title">Chart</h2>
        <p id="chart-description" class="card-description"></p>
      </div>
      <div class="card-content">
        <div class="chart-container">
          <canvas id="chart" role="img"></canvas>
          <div id="chart-tooltip" class="chart-tooltip" hidden></div>
        </div>
        <div id="chart-legend" class="chart-legend" hidden></div>
      </div>
      <details id="data" class="card-data">
        <summary class="card-data-trigger"><span id="data-label">Data</span><span id="data-chevron" class="collapsible-chevron"></span></summary>
        <div class="data-table">
          <div class="data-table-toolbar">
            <label class="input-group">
              <span class="input-icon" id="filter-icon"></span>
              <input id="filter" class="input" type="search" placeholder="Filter rows…" aria-label="Filter rows">
            </label>
          </div>
          <div class="table-container">
            <table id="table" class="table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
          <p id="table-count" class="data-table-count"></p>
        </div>
      </details>
    </section>

    <section id="cards-section" hidden></section>

    <details id="notes" class="collapsible" hidden>
      <summary class="collapsible-trigger"><span>Notes</span><span id="notes-chevron" class="collapsible-chevron"></span></summary>
      <ul id="notes-list" class="collapsible-content"></ul>
    </details>
  </main>
</body>
