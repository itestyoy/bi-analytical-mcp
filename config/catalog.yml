  - name: dim_users
    description: >
      User attributes dimension: one row per player, keyed by player_id_of_internal,
      built from the player's install record. Holds acquisition, geo, device and
      app attributes used to segment and cohort players. Join to fct_analytics_events
      and fct_experiment_assignments on player_id_of_internal. All columns here are
      per-player attributes (no per-event scoping applies).
    meta:
      mcp:
        role: users            # logical name (the dbt model can be named anything)
        # NO measures here: MetricFlow forbids them on a model with a validity window, so any
        # declared measure would be dropped with a warning at render time. Count players on an
        # events source instead — count_distinct of the player key.
    columns:
      - name: player_id_of_internal
        data_type: integer
        description: "Player identifier (primary key; the join target for events and experiments)."
        meta:
          mcp:
            entity: { name: user, type: primary }
      # Non-entity columns of this dimension model are groupable dimensions; their
      # type is inferred from the native `data_type` (date/timestamp -> time, else
      # categorical). Only value hints / non-day granularity live in meta.
      # ── VALIDITY WINDOW: this table is SLOWLY-CHANGING (one row per player per window) ──
      # Every join to it is point-in-time — see the note above the models list. Delete these two
      # columns if your install record really is one flat row per player.
      - name: install_time_valid_from
        data_type: timestamp
        description: "Start of this version's validity window (inclusive)."
        meta: { mcp: { dimension: { validity: start } } }
      - name: install_time_valid_until
        data_type: timestamp
        description: "End of this version's validity window (inclusive)."
        meta: { mcp: { dimension: { validity: end } } }
      - name: install_date
        data_type: timestamp
        description: "When the player installed the app — the cohort/acquisition time dimension."
      - name: platform
        data_type: string
        description: "Device OS family the player installed on."
        meta: { mcp: { values: [android, ios] } }
      - name: os_version
        data_type: string
        description: "Operating-system version at install time."
      - name: device_model
        data_type: string
        description: "Device model the player installed on."
      - name: country
        data_type: string
        description: "Player country (ISO 3166-1 alpha-2) for geo segmentation."
      - name: language
        data_type: string
        description: "Player's in-game language code."
      - name: media_source
        data_type: string
        description: "Acquisition channel / attribution source (e.g. organic, googleadwords_int, Facebook Ads)."
      - name: acquisition_type
        data_type: string
        description: "Install lifecycle category from attribution (organic vs. reattributed vs. reinstalled)."
        meta: { mcp: { values: [install, s-install, reinstall, reattribution] } }
      - name: campaign
        data_type: string
        description: "Attribution campaign name the player was acquired through."
      - name: campaign_id
        data_type: string
        description: "Attribution campaign id."
      - name: app_id
        data_type: string
        description: "Store bundle id of the app the player installed."
      - name: app_name
        data_type: string
        description: "Short app name (e.g. fillwords, sky_words, word_pizza)."
      - name: app_version
        data_type: string
        description: "App version the player originally installed (install-time app version)."
      - name: install_build_number
        data_type: string
        description: "App build number the player originally installed."
      - name: install_package
        data_type: string
        description: >
          Android installer / vendor package that initiated the install; empty on
          iOS, 'undefined' for dev/sideloaded APKs.
      - name: is_valid_install
        data_type: string
        description: "TRUE when install_package = com.android.vending (a legitimate Play Store install)."

  # A/B-test assignments — like the users dimension but MANY rows per player: one
  # row per (player, experiment). Joinable to events/users by the user entity.
  # Window events to [assigned_at, ended_at], group by experiment_name+variant_group,
  # aggregate per group, then run the `ab_test` tool. The dbt model can be named
  # anything; only role: experiments matters.
  - name: fct_experiment_assignments
    description: >
      A/B-test assignments: one row per (player, experiment). Each row records
      which experiment a player entered, the assigned variant, and the
      [assigned_at, ended_at] window. To analyze a test, window events to that
      interval, group by experiment_name + variant_group, aggregate per group, and
      run the ab_test tool. Join to events/users on player_id_of_internal.
    meta:
      mcp:
        role: experiments
    columns:
      - name: player_id_of_internal
        data_type: integer
        description: "Player identifier (joins to events and users; many rows per player)."
        meta:
          mcp:
            entity: { name: user, type: foreign }   # foreign: many rows per player
      - name: experiment_name
        data_type: string
        description: "Name of the A/B test / experiment the player was assigned to."
      - name: experiment_type
        data_type: string
        description: "Experiment category."
        meta: { mcp: { values: [monetization, product, custom] } }
      - name: variant_group
        data_type: string
        description: "Variant/group the player was assigned (e.g. control, test, variant_b)."
      - name: assigned_at
        data_type: timestamp
        description: "When the player entered the experiment — the window start for analysis."
      - name: ended_at
        data_type: timestamp
        description: "When the experiment ended — the window end for analysis."

