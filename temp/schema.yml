            property: true
      - name: cup_difference_of_event_data
        data_type: integer
        description: "Absolute cup/trophy change from the battle; logged only against a real opponent, never against a bot."
        meta:
          mcp:
            property: true
      - name: opponent_type_of_event_data
        data_type: string
        description: "Type of opponent."
        meta:
          mcp:
            property: true
      - name: time_to_match_of_event_data
        data_type: integer
        description: "Matchmaking time in milliseconds."
        meta:
          mcp:
            unit: seconds
            property: true
      - name: stage_number_of_event_data
        data_type: integer
        description: "Stage number within a multi-stage competition/race."
