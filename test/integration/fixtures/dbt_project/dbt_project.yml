name: "test_project"
version: "1.0.0"
config-version: 2
profile: "test_project"
model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]
models:
  test_project:
    +materialized: table
seeds:
  test_project:
    seed_events:
      +column_types:
        event_timestamp: timestamp
        event_properties: jsonb
    seed_users:
      +column_types:
        install_date: date
