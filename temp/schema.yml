        meta:
          mcp:
            array:
              encoding: json
              fields: { word_number: int, word_name: string, time_from_previous: numeric, mistakes_from_previous: int, word_dictionary: string }
      # battle of wits
      - name: bot_level_of_event_data
        data_type: string
