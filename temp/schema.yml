  - name: dim_users
    description: >
      User attributes dimension built from the player's install record: acquisition,
      geo, device and app attributes used to segment and cohort players.

      GRAIN: one row per player per install-VALIDITY INTERVAL — usually exactly one row
      per internal_player_id, but re-attribution and re-installs add further rows, each
      valid for its own [install_time_valid_from, install_time_valid_until] window. So
      internal_player_id alone is NOT unique here: joining on it alone fans out those
      players and double-counts their events.
      HOW TO JOIN IT IN A PIPELINE — use the `join` stage with a `between` window; do
      NOT hand-roll the temporal predicate:
          { "stage": "join", "with": "users", "on": "internal_player_id",
            "attrs": [ ...the attributes you need... ],
            "between": { "value": "device_time",
                        "from": "install_time_valid_from",
                        "to":   "install_time_valid_until" } }
      `on` gives the key equality; `between` ANDs the temporal predicate
      `device_time BETWEEN install_time_valid_from AND install_time_valid_until`, which
      picks the install record in force when the event happened — so the join stays
      1:1 and events are not double-counted. Omitting `between` here is a bug: it fans
      out re-attributed / re-installed players. The same pattern applies to the
      experiments source — put its `assigned_at`-vs-window match in `between`.
      For a player-level count use aggregate with count_distinct on internal_player_id
      (never a plain count/count(*)).
    meta:
      mcp:
        role: users            # logical name (the dbt model can be named anything)
    columns:
      - name: internal_player_id
        data_type: integer
        description: >
          Player identifier — the join target for events and experiments. NOT unique on
          its own: a player with re-attributions/re-installs has one row per validity
          interval, so pair it with the
          device_time BETWEEN install_time_valid_from AND install_time_valid_until
          predicate (see the model description) to keep the join one-to-one.
        meta:
          mcp:
            entity: { name: user, type: primary }
      # Non-entity columns of this dimension model are groupable dimensions; their
      # type is inferred from the native `data_type` (date/timestamp -> time, else
      # categorical). Only value hints / non-day granularity live in meta.
      - name: install_date
        data_type: timestamp
        meta:
          mcp:
            is_time: true   # the time axis of this dimension ("installs by install date")
        description: >
          When the player installed the app (UTC instant) — the cohort/acquisition time
          dimension, and the anchor for retention. Retention day is the whole 24-hour
          bucket between this and the event time, so it always requires joining this
          model to the events fact. Do NOT compute it by hand: use the pipeline op
          compute op=elapsed_days with from=install_date, to=device_time — it returns
          retention day in whole 24-hour buckets (NOT calendar days) and handles the
          casting, negative spans, and missing-install case for you. A player present in
          the events fact but absent from this model has no install_date on the join;
          elapsed_days folds that (and any pre-install event) to day 0 by default
          (pass clamp_zero:false only if you deliberately want the raw NULL/negative value).
      - name: install_time_valid_from
        data_type: timestamp
        meta:
          mcp:
            dimension: { validity: start }
        description: >
          Start of the window during which this install record is the authoritative one
          for the player (UTC instant). Join key companion, not a reporting dimension:
          match the event's device_time with
          device_time BETWEEN install_time_valid_from AND install_time_valid_until.
          Never NULL — an open lower bound is the sentinel 1970-01-01 00:00:00.
          NEVER use this field for retention, cohorting, install counts or any other
          calculation, and never expose it as a reporting dimension or time axis. It is
          purely TECHNICAL: a record-versioning bound, not the moment the player
          installed. Its value is a bookkeeping artefact (it carries sentinels and
          shifts whenever a re-attribution rewrites the record), so any metric built on
          it is meaningless. The one and only install moment for retention, cohorts and
          age-since-install is install_date, which is the correct and current value for
          exactly the interval this record is valid for.
      - name: install_time_valid_until
        data_type: timestamp
        meta:
          mcp:
            dimension: { validity: end }
        description: >
          End of the window during which this install record is authoritative (UTC
          instant, inclusive — the predicate is a closed BETWEEN). The currently-active
          record carries the sentinel 2099-12-31 23:59:59 rather than NULL, so the
          BETWEEN needs no coalesce.
          NEVER use this field for retention, cohorting, churn or any other calculation,
          and never expose it as a reporting dimension or time axis. It is purely
          TECHNICAL: the end of a record's validity window, NOT the player's last
          activity, churn date or install date — for active players it is just the
          sentinel 2099-12-31. Use install_date as the install moment for retention and
          cohorts (it is the correct, current value for exactly the interval this record
          covers), and event timestamps for anything about player activity.
      - name: platform
        data_type: string
        description: "Device OS family the player installed on."
      - name: os_version
        data_type: string
        description: "Operating-system version at install time."
      - name: user_source
        data_type: string
        description: "Origin of the user acquisition (attribution source classification)."
      - name: country_group
        data_type: string
        description: "Grouping of countries into geo/market segments for analysis."
      - name: device_model
        data_type: string
        description: "Device model the player installed on."
      - name: country
        data_type: string
        description: "Player country (ISO 3166-1 alpha-2) for geo segmentation."
      - name: language
        data_type: string
        description: "Player's in-game language code."
      - name: media_source
        data_type: string
        description: >
          Acquisition channel / attribution source the player was acquired through.
      - name: acquisition_type
        data_type: string
        description: "Install lifecycle category from attribution (organic vs. reattributed vs. reinstalled)."
      - name: campaign
        data_type: string
        description: "Attribution campaign name the player was acquired through."
      - name: campaign_id
        data_type: string
        description: "Attribution campaign id."
        meta:
          mcp:
            index: false   # groupable, but an id / free text has no value set worth profiling
      - name: app_id
        data_type: string
        description: "Store bundle id of the app the player installed."
        meta:
          mcp:
            index: false   # groupable, but an id / free text has no value set worth profiling
      - name: app_name
        data_type: string
        description: >
          Short app name — a stable per-game code, distinct from the store bundle id in app_id.
      - name: app_version
        data_type: string
        description: "App version the player originally installed (install-time app version)."
      - name: is_valid_install
        data_type: string
        description: "TRUE when install_package = com.android.vending (a legitimate Play Store install)."

  # A/B-test assignments — like the users dimension but MANY rows per player: one
  # row per (player, experiment). Joinable to events/users by the user entity.
  # Window events from assigned_at ONWARD (no per-player end bound — see the
  # description), group by experiment_name+variant_group, aggregate per group, then run
  # the `ab_test` tool. The dbt model can be named anything; only role: experiments matters.
  - name: fct_experiment_assignments
    description: >
      A/B-test assignments: one row per (player, experiment). Each row records which
      experiment a player entered, the assigned variant, and when the assignment
      started. Join to events/users on internal_player_id.

      ATTRIBUTION WINDOW — COUNT FROM assigned_at ONWARD, WITH NO END BOUND. This is the
      firstExposure model, and it is what GrowthBook does: once a player is exposed, all
      of their subsequent events count toward their variant. So the only per-player
      predicate is

          device_time >= assigned_at

      There is deliberately NO end-of-experiment column in this model to pair it with.
      The period AFTER the experiment closes is not noise to be trimmed —
      it is often the whole point: we want to see what happens to those users afterwards,
      whether a lift persists, decays or reverses once the test is over. Closing the
      window destroys exactly that signal. A per-player upper bound is also the classic
      way to get numbers that disagree with GrowthBook: it drops everything a player did
      after their own assignment window closed — mostly ad and IAP revenue, which keeps
      accruing — so every absolute total comes out systematically lower, and it gives
      players unequal observation lengths, which biases the comparison between variants
      rather than merely shrinking it.

      DEFAULT BEHAVIOUR: leave the window OPEN. Never introduce an end bound on your own
      initiative, not even to "match the experiment dates" — only when the user
      explicitly asks to cut the analysis off at a point in time. When they do ask, use
      ONE bound shared by every player and variant (the experiment phase end or the
      reporting period end), never a per-player end: equal windows for all
      groups is what makes variants comparable. And say which bound was applied.

      Then group by experiment_name + variant_group, aggregate per group, and run the
      ab_test tool.
      NOTE: all names here — experiment_name, variant_group, experiment_type, etc. —
      are stored in lowercase; therefore always perform any search/filter/comparison
      in lowercase (e.g. lower(column) = lower('value')).
    meta:
      mcp:
        role: experiments
    columns:
      - name: internal_player_id
        data_type: integer
        description: "Player identifier (joins to events and users; many rows per player)."
        meta:
          mcp:
            entity: { name: user, type: foreign }   # foreign: many rows per player
      - name: experiment_name
        data_type: string
        description: >
          Name of the A/B test / experiment the player was assigned to.
          Stored in lowercase — always filter/compare in lowercase
          (e.g. lower(experiment_name) = lower('value')).
      - name: experiment_type
        data_type: string
        description: >
          Experiment category. Stored in lowercase — always filter/compare in
          lowercase (e.g. lower(experiment_type) = lower('value')).
      - name: variant_group
        data_type: string
        description: >
          Variant/group the player was assigned. Stored in lowercase — always filter/compare in
          lowercase (e.g. lower(variant_group) = lower('value')).
      - name: assigned_at
        data_type: timestamp
        description: >
          When the player was first exposed to the experiment — the ONLY per-player time
          bound used in analysis. Filter events with device_time >= assigned_at and count
          everything from there on (firstExposure), with no per-player end bound.

  # ── SECOND EVENTS FACT — ad-associated stability events ────────────────────────────────
  # An EQUAL source to the analytics fact, not nested under it. Address it with
  # source: 'crashlytics' (semantic_index({ source, event }),
  # build_native_model({ source: 'crashlytics' }), semantic_models[].from).
  #
  # Structural rules observed here:
  #   · primary_entity is `crash`, declared on event_id — NOT `event`, which
  #     fct_analytics_events owns.
  #   · it declares is_event_name + is_time, as a fact must.
  #   · `ad_funnel` is OWNED here as `unique` — one error per tracking, so this side is
  #     the join target and the governed path works. `foreign` on fct_analytics_events,
  #     where a tracking spans several events. Both sides declare a 2-part key.
  #   · column names use the `_of_` form, never `__` (MetricFlow reserves `__`).
  - name: fct_stability_events
    description: >
      Ad-associated stability events: one row per error — a crash, non-fatal error or ANR
      that happened while an ad was RUNNING on screen. Keyed by event_id (unique). Where
      tracking_id is set, (internal_player_id, tracking_id) is unique too, so a join on it
      does not fan out; about a third of the rows have NO tracking_id — an error whose
      ad slot was recorded as open but without a selected tracking — and those never
      join to the ad funnel.

      EVERY row has an install interval on dim_users covering its device_time (an EXISTS
      filter upstream), so a join to dim_users loses nothing.

      WHY ONE ERROR PER AD — an ad tracking is one request-to-show cycle of one ad, and it
      can own at most ONE error, ever. Upstream keeps the earliest error of each
      (player, tracking) and releases every later one as a plain error, so those are not
      here.

      WHAT IS NOT HERE — a plain error with no ad open, a second or later error of the same
      tracking, an error whose selected ad slot was not EXPLICITLY unfinished (finished, or
      the is_finished key missing), and an error with no install interval at its device
      time. So this is not the place to ask how many crashes there were in total.

      tracking_id is the ad the error was ATTRIBUTED to: of the slots the client had open,
      the still-unfinished one with the latest start watch time. ad_format says which
      format that was. A SECOND ad can be running alongside, and that is not carried as
      its own column; the raw per-slot start times and is_finished flags are the snapshot
      it can be read from.
    meta:
      mcp:
        role: crashlytics           # the logical name the tools use: source: 'crashlytics'
        partition_column: event_date      # cost hint: always constrain this (or device_time)
        require_time_range: true          # a query or pipeline over this source must carry a bounded window
        event_semantics:
          crash_event: FATAL        # a hard crash that killed the app
          non_fatal_event: NON_FATAL
          anr_event: ANR            # Application Not Responding (main thread blocked)
        known_events:               # the only three values event_name ever takes
          - FATAL
          - NON_FATAL
          - ANR
        entities:
          # The ad view this error belongs to, OWNED here as `unique`: an ad tracking can
          # hold at most ONE error (upstream keeps only the earliest per player+tracking),
          # so (tracking_id, internal_player_id) is unique on this model wherever
          # tracking_id is set — verified, zero exceptions. Rows with a NULL tracking_id
          # (about a third) simply never match. That makes this side the join TARGET, so
          # the governed path works:
          # a metric query over the analytics fact can group by
          # { model: 'crashlytics', attribute: '<attr>' }. On fct_analytics_events the same
          # relationship is `foreign`, because one tracking spans several of its events
          # (request -> load -> start -> revenue -> finish).
          ad_funnel:
            type: unique
            key: [tracking_id, internal_player_id]
    columns:
      # ---- the unique key -------------------------------------------------
      - name: internal_player_id
        data_type: integer
        description: >
          The player — the same surrogate id as on dim_users, fct_analytics_events and
          fct_player_acquisition, and the join key to them. Never NULL. Not unique on its
          own: a player can have many ad-associated errors.
        meta:
          mcp:
            entity: { name: user, type: foreign }
      - name: tracking_id
        data_type: string
        description: >
          Id of the ad tracking this error was attributed to — the same id as
          fct_analytics_events.tracking_id_of_event_data, so it is the join key from an
          error to the ad funnel that produced it. Unique per player when set. NULL on
          about a third of the rows: the client logged an open, unfinished ad slot (see
          ad_format and the per-slot snapshot) but no tracking id for it, so the error
          cannot be tied to a funnel. Filter `tracking_id is not null` for funnel joins.
        meta:
          mcp:
            dimension: {}
            index: false   # groupable, but an id has no value set worth profiling

      # ---- role columns ---------------------------------------------------
      - name: device_time
        data_type: timestamp
        description: >
          When the error happened on the device — the metric time axis of this fact.
          Sanitized upstream: a device time more than 30 days from the receive time, or
          ahead of it, is replaced by the receive time, and it is capped at the receive
          time and at now.
        meta:
          mcp:
            is_time: true   # granularity defaults to day
      - name: event_date
        data_type: date
        description: >
          date(device_time), and the column this view's 90-day window is applied to, so its
          minimum value is current_date - 90 days.
        meta:
          mcp:
            dimension: {}   # groupable (daily buckets); device_time remains the metric_time axis
      - name: event_name
        data_type: string
        description: >
          The error class, from the Crashlytics export's error_type: FATAL (a crash that
          killed the app), NON_FATAL (a caught and logged exception) or ANR (Application
          Not Responding — the main thread was blocked). Uppercase, as the export reports
          it.
        meta:
          mcp:
            is_event_name: true

      # ---- the error itself -----------------------------------------------
      - name: event_id
        data_type: string
        description: >
          Crashlytics id of the occurrence and the identity of this model — unique here
          (a report Crashlytics re-exported on a later day is deduplicated to its earliest
          copy).
        meta:
          mcp:
            entity: { name: crash, type: primary }
      - name: received_time
        data_type: timestamp
        description: >
          The export's received_timestamp: when Crashlytics delivered the report. Always
          at or after device_time. Rows are not dated by it — a report received today can
          belong to an earlier event_date.
        meta:
          mcp:
            dimension: {}
      - name: issue_id
        data_type: string
        description: >
          Crashlytics issue id — the grouping key of a defect: occurrences sharing a
          stack-trace signature share it. count_distinct on it counts distinct defects, as
          against a row count for occurrences.
        meta:
          mcp:
            dimension: {}
            index: false
      - name: issue_title
        data_type: string
        description: >
          Crashlytics issue title — the crashing frame, e.g. a shared-object name for a
          native crash or the symbol for a managed one. Determined by issue_id and much
          coarser: many issues share a title. Some values are the literal 'Native method',
          where the real title is in issue_subtitle, or carry a leading 'Native method - '.
        meta:
          mcp:
            dimension: {}
      - name: issue_subtitle
        data_type: string
        description: >
          Secondary line of the Crashlytics issue — the signal or reason, e.g.
          'SIGABRT (ABORT)', or 'unknown' where the export did not classify it. Free text
          that varies per occurrence even for one issue_id, so it is not a property of the
          defect and does not aggregate. It also supplies the title when issue_title is
          'Native method'.
        meta:
          mcp:
            dimension: {}
      - name: issue_url
        data_type: string
        description: >
          Firebase console link to the issue, assembled upstream from the Firebase project
          id, the platform, the bundle id and issue_id. Determined entirely by issue_id, so
          it adds no grouping power of its own.
        meta:
          mcp:
            dimension: {}
            index: false
      - name: exception_types
        data_type: string
        description: >
          The exception class names of the occurrence, as to_json_string over the export's
          exceptions array — a JSON array of strings, or the literal 'null' where the
          report had no exceptions (native crashes). Stable per issue_id. Parse the JSON
          before unnesting.
        meta:
          mcp:
            array: { items: string, encoding: json }
      - name: exception_messages
        data_type: string
        description: >
          The exception messages of the occurrence, positionally aligned with
          exception_types, in the same JSON-array-or-'null' encoding. Free text, varies per
          occurrence.
        meta:
          mcp:
            array: { items: string, encoding: json }

      # ---- the ad this error was attributed to ----------------------------
      - name: ad_format
        data_type: string
        description: >
          Format of the ad the error was attributed to: 'banner', 'inter' (interstitial) or
          'reward' (rewarded). Never NULL — set even where tracking_id is NULL (those rows
          are all 'banner'). These are the upstream short codes, not the
          spelling used by fct_analytics_events.ad_type_of_event_data — do not compare the
          two literally.
        meta:
          mcp:
            dimension: {}
      - name: ad_start_watch_device_time
        data_type: timestamp
        description: >
          Device timestamp at which the attributed ad view started, from that tracking's
          `date` field in the client's custom keys. Subtract it from device_time to get how
          far into the ad view the error occurred. Not clock-sanitized the way device_time
          is, so clamp the difference before averaging.
        meta:
          mcp:
            dimension: {}

      # ---- app / device envelope -------------------------------------------
      - name: bundle_id
        data_type: string
        description: >
          Store bundle id of the app the error came from. The same identifier as on
          fct_analytics_events and fct_player_acquisition.
        meta:
          mcp:
            index: false   # groupable, but an id / free text has no value set worth profiling
            dimension: { bundle: true }   # the APP identifier for THIS fact
      - name: platform
        data_type: string
        description: >
          Device OS family, lower-cased. Same values as dim_users.platform.
        meta:
          mcp:
            dimension: {}
      - name: os_version
        data_type: string
        description: >
          OS version of the device at the time of the error. The per-event value;
          dim_users.os_version is the install-time one.
        meta:
          mcp:
            dimension: {}
      - name: app_version
        data_type: string
        description: "App version the error was reported from."
        meta:
          mcp:
            dimension: {}

      # ---- raw per-slot snapshot, as logged in the custom keys -------------
      # The client's tracking slots as written at the moment of THIS error, before the
      # selector picked one. Diagnostic: they are how you tell that a second ad was running
      # alongside the attributed one. A slot with a start watch time and is_finished = false
      # was still running; is_finished = true means it had already ended; NULL means the
      # client did not set that key.
      - name: tracking_start_watch_time_of_banner
        data_type: timestamp
        description: >
          Device timestamp the banner slot's ad view started. NULL where no banner tracking
          was open.
        meta:
          mcp:
            dimension: {}
      - name: tracking_start_watch_time_of_rewarded
        data_type: timestamp
        description: >
          Device timestamp the rewarded slot's ad view started. NULL where no rewarded
          tracking was open.
        meta:
          mcp:
            dimension: {}
      - name: tracking_start_watch_time_of_interstitial
        data_type: timestamp
        description: >
          Device timestamp the interstitial slot's ad view started. NULL where none was
          open.
        meta:
          mcp:
            dimension: {}
      - name: tracking_is_finished_of_banner
        data_type: boolean
        description: >
          Whether the banner slot had already finished at the moment of this error. NULL
          where the client did not set the key.
        meta:
          mcp:
            dimension: {}
      - name: tracking_is_finished_of_rewarded
        data_type: boolean
        description: >
          Whether the rewarded slot had already finished at the moment of this error. NULL
          where the client did not set the key.
        meta:
          mcp:
            dimension: {}
      - name: tracking_is_finished_of_interstitial
        data_type: boolean
        description: >
          Whether the interstitial slot had already finished at the moment of this error.
          TRUE means it ended while another slot kept running. NULL where the client did
          not set the key.
        meta:
          mcp:
            dimension: {}

  # ── MEASURES SOURCE — user-acquisition spend ───────────────────────────────────────────
  # NOT an events source: it declares is_time and a measure, and NO event_name. Rows are
  # amounts, not events. Address it with source: 'acquisition'
  # (build_native_model({ source: 'acquisition' }), semantic_models[].from).
  #
  # Structural rules observed here:
  #   · primary_entity is `acquisition` — distinct from `event`, `crash` and `user`. It is
  #     the model's logical identity; there is no separate physical key column, because the
  #     grain IS the player.
  #   · internal_player_id is declared `foreign`, not `unique`, even though it is unique
  #     here: the `user` entity is OWNED by dim_users, and an entity has exactly one owner.
  #   · is_time is declared, is_event_name is not.
  #   · the amount carries meta.mcp.measure and is therefore NOT groupable; the aggregation
  #     function is chosen per question by the caller, not fixed here.
  - name: fct_player_acquisition
    description: >
      User-acquisition spend per player: one row per player, holding the day they were
      acquired and the UA spend attributed to them. Full history, no time window.

      internal_player_id is UNIQUE here, so a join on it does not fan out, and a player
      count is a plain row count.

      player_probabilistic_spend is an ALLOCATED share, not an observed per-player price:
      UA spend is booked per campaign/day, and each player carries the part of it that
      falls to them. Every dollar is allocated exactly once, so the figure is additive —
      summing it over any set of players gives that set's real cost, and summing it over
      all of them gives the UA budget. A player whose acquisition matched no spend carries
      zero, which is why organic and unmatched players read 0 rather than NULL.

      This model has no channel, campaign, geo or device columns: for those, join
      dim_users on the user entity.
    meta:
      mcp:
        role: acquisition
        primary_entity: acquisition   # MUST differ from every other model's
    columns:
      - name: internal_player_id
        data_type: integer
        description: >
          The player. Never NULL and unique — one row per player. The same id as on
          dim_users and both events sources, so it is the join key to them. Declared
          foreign because dim_users owns the user entity.
        meta:
          mcp:
            entity: { name: user, type: foreign }
      - name: cohort_date
        data_type: timestamp
        description: >
          The day the player was acquired, day-truncated. This source's time axis, and
          the column to cohort by. A player who was re-acquired later (reinstall,
          re-attribution) still has one row, dated by the FIRST acquisition.
        meta:
          mcp:
            is_time: true   # granularity defaults to day
      - name: player_probabilistic_spend
        data_type: numeric
        description: >
          The UA spend attributed to this player. Never NULL — zero when their acquisition
          matched no spend.
        meta:
          mcp:
            measure: { unit: usd, label: "Allocated UA spend" }
