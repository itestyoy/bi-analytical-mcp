<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Query Result</title>
</head>
<body>
  <main class="main">
    <header class="header">
      <div class="header-text">
        <h1 id="title" class="title">Query Result</h1>
        <p id="subtitle" class="subtitle">Waiting for the result…</p>
      </div>
      <button id="fullscreen-btn" class="icon-btn" type="button" title="Enter fullscreen" aria-label="Enter fullscreen" hidden>
        <svg id="expand-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg id="compress-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" hidden><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <p id="notice" class="notice" hidden></p>

    <section id="chart-section" class="section" hidden>
      <h2 id="chart-title" class="section-title">Chart</h2>
      <div class="chart-container">
        <canvas id="chart" role="img"></canvas>
      </div>
    </section>

    <section id="cards-section" class="cards" hidden></section>

    <section id="table-section" class="section" hidden>
      <div class="toolbar">
        <input id="filter" class="filter" type="search" placeholder="Filter rows…" aria-label="Filter rows">
        <button id="next-page-btn" class="btn" type="button" hidden>Next page</button>
      </div>
      <div class="table-container">
        <table id="table" class="table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <pre id="raw" class="raw" hidden></pre>
  </main>
  <script type="module" src="./src/mcp-app.js"></script>
</body>
</html>
