name: "jaffle_sl"
version: "1.0.0"
config-version: 2
profile: "jaffle_sl"
model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]
models:
  jaffle_sl:
    +materialized: table
seeds:
  jaffle_sl:
    raw_orders:
      +column_types:
        ordered_at: timestamp
        order_total: numeric
        is_food_order: boolean
        is_drink_order: boolean
    raw_customers:
      +column_types:
        first_ordered_at: timestamp
